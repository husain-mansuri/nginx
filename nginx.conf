worker_processes 1;

events {
    worker_connections 1024;
}

http {
    error_log /tmp/nginx_test.log;
    access_log /tmp/nginx_test_access.log;
    
    # DNS resolver for proxy_pass with variables
    # Required for nginx to resolve domain names in proxy_pass when using variables
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Minimal proxy params
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    send_timeout                60s;
    
    # Variable for fabric detection
    map $args $fabric_is_sapphire {
        default 1;
        ~sapphire=0 0;
    }
    
    # Test our critical location block
    server {
        listen 8082;
        server_name test.local;
        
        # Mock upstreams
        set $upstream_consumer_ui http://127.0.0.1:3000;
        
        # Our modified location block
        # Matches both main pages and sub-pages (e.g., /bangalore/clinic/name and /bangalore/clinic/name/about)
        location ~* ^/([^/]+)/(clinic|hospital)/([^/]+)(/[^/]+)?$ {
            # Variables extraction
            set $consumer_ui_city $1;
            set $consumer_ui_profile_type $2;
            set $consumer_ui_slug $3;
            # $4 is optional - empty string when not captured (main pages), e.g., "/about" when captured (sub-pages)
            set $consumer_ui_sub_page $4;
            
            # S3 configuration - AWS S3 Mumbai region
            set $consumer_ui_s3_bucket "practo-dev-mumbai-static-apps";
            set $consumer_ui_s3_endpoint "practo-dev-mumbai-static-apps.s3.ap-south-1.amazonaws.com";
            set $consumer_ui_s3_folder_name "consumer-ui/export-assets";
            
            # Build S3 path: include sub-page if present (e.g., /about becomes /about.html)
            # Main page (no sub-page): bangalore/clinic/slug.html (empty string interpolates correctly)
            # Sub-page: bangalore/clinic/slug/about.html (when $consumer_ui_sub_page is "/about")
            # Note: When $consumer_ui_sub_page is empty string, interpolation works: slug.html
            set $consumer_ui_s3_path "$consumer_ui_city/$consumer_ui_profile_type/$consumer_ui_slug$consumer_ui_sub_page.html";
            
            # Build S3 URL and track source (using HTTPS for AWS S3)
            set $consumer_ui_s3_url "https://$consumer_ui_s3_endpoint/$consumer_ui_s3_folder_name/$consumer_ui_s3_path";
            set $consumer_ui_served_from "AWS(SSG)";
            
            # For Sapphire requests, rewrite to named location for S3 proxy
            # Using 'last' flag to exit this location block and jump to @__s3_establishment_profile
            # Named location approach avoids nginx if-block limitations for proxy_set_header Host
            # Variables set above persist and are accessible in the named location
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /s3_establishment_profile last;
            }
        }
        
        # Named location for S3 proxy - avoids if-block limitations
        # Called via rewrite with 'last' flag from main location block
        # All variables set in the calling location block are accessible here
        # This allows proxy_set_header Host to work reliably (not in an if-block context)
        location /s3_establishment_profile {
            internal;
            
            # Add headers to track S3-served content
            add_header SERVED-FROM $consumer_ui_served_from always;
            add_header S3-URL $consumer_ui_s3_url always;

            # Set proxy headers manually (not using proxy_params to avoid Host header conflict)
            # Host header must be the S3 endpoint for virtual-hosted bucket routing
            proxy_set_header Host $consumer_ui_s3_endpoint;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Error handling for S3 404s
            proxy_intercept_errors on;
            error_page 404 = @establishment_profile_fallback;
            
            # Rewrite to S3 path - handles both main pages and sub-pages
            # Using 'break' flag to stop rewrite processing and continue with proxy_pass
            # $consumer_ui_s3_path already includes .html extension and sub-page if present
            # Virtual-hosted style: path is /folder/path (bucket is in Host header)
            rewrite ^ /$consumer_ui_s3_folder_name/$consumer_ui_s3_path break;
            
            
            # Proxy to S3 endpoint using HTTPS
            # AWS S3 requires SSL verification
            proxy_ssl_server_name on;
            proxy_ssl_verify off;  # Set to 'on' in production if you have proper SSL certificates
            proxy_pass https://$consumer_ui_s3_endpoint;            
        }
        
        # Proxy Next.js assets (_next, consumer-ui-assets, etc) to Next.js dev server
        location ~* ^/(_next|consumer-ui-assets)/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Fallback location for establishment profile 404s from S3
        # Only called from consumer_ui flow when S3 returns 404 (file not found)
        # The named location @__s3_establishment_profile sets error_page 404 to this fallback
        # Topaz flow never calls this - it directly proxies and returns 404s to client
        location @establishment_profile_fallback {
            internal;
            
            # Add headers to track S3-served content
            set $consumer_ui_served_from "NEXT(SSR)";
            add_header SERVED-FROM $consumer_ui_served_from always;
            add_header S3-URL $consumer_ui_s3_url always;

            # Always proxy to Next.js SSR when S3 returns 404
            # This handles cases where static files haven't been generated yet or generation failed
            
            
            # Add standard proxy headers
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;
            
            # Add custom headers to indicate source is Next.js SSR
            # add_header SERVED-FROM $consumer_ui_served_from always;
            # add_header S3-URL $consumer_ui_s3_url always;
            
            # Proxy to Next.js
            rewrite ^ $request_uri break;
            proxy_pass $upstream_consumer_ui;
        }

        # Direct proxy to AWS S3 for consumer-ui export assets
        # This is for direct access patterns (if needed)
        location ~ ^/consumer-ui/export-assets/(?P<path>.*) {
            set $consumer_ui_s3_endpoint "practo-dev-mumbai-static-apps.s3.ap-south-1.amazonaws.com";
            
            # Set proxy headers manually (not using proxy_params to avoid Host header conflict)
            # Host header must be the S3 endpoint for virtual-hosted bucket access
            proxy_set_header Host $consumer_ui_s3_endpoint;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Proxy to AWS S3 using HTTPS
            proxy_ssl_server_name on;
            proxy_ssl_verify off;  # Set to 'on' in production if you have proper SSL certificates
            proxy_pass https://$consumer_ui_s3_endpoint/consumer-ui/export-assets/$path;
            add_header X-S3-Asset-Path https://$consumer_ui_s3_endpoint/consumer-ui/export-assets/$path;
        }
    }
    
    # Fallback server
    server {
        listen 80 default_server;
        server_name _;
        return 404 "Not found";
    }
}

