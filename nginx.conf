worker_processes 1;

events {
    worker_connections 1024;
}

http {
    error_log /tmp/nginx_test.log;
    access_log /tmp/nginx_test_access.log;
    
    # Minimal proxy params
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    send_timeout                60s;
    
    # Variable for fabric detection
    map $args $fabric_is_sapphire {
        default 1;
        ~sapphire=0 0;
    }
    
    # Test our critical location block
    server {
        listen 8082;
        server_name test.local;
        
        # Mock upstreams
        set $upstream_consumer_ui http://127.0.0.1:3000;
        
        # Our modified location block
        location ~* ^/([^/]+)/(clinic|hospital)/([^/]+)/?.*$ {
            add_header SERVED-FROM "Static" always;
            # Add headers to track S3-served content
            
            # Variables extraction
            set $consumer_ui_city $1;
            set $consumer_ui_profile_type $2;
            set $consumer_ui_slug $3;
            
            # S3 configuration
            set $consumer_ui_s3_bucket "localstack-bucket";
            set $consumer_ui_s3_endpoint "127.0.0.1:4566";
            set $consumer_ui_s3_folder_name "consumer-ui/export-assets";
            
            # Build S3 URL and track source
            set $consumer_ui_s3_url http://$consumer_ui_s3_endpoint/$consumer_ui_s3_bucket/$consumer_ui_s3_folder_name/$consumer_ui_city/$consumer_ui_profile_type/$consumer_ui_slug.html;
            set $consumer_ui_served_from "AWS(SSG)";

            
            # add_header S3-URL $consumer_ui_s3_url always;
            

            rewrite ^ /$consumer_ui_s3_bucket/$consumer_ui_s3_folder_name/$consumer_ui_city/$consumer_ui_profile_type/$consumer_ui_slug.html break;
            proxy_pass http://$consumer_ui_s3_endpoint;
             
           

            
            # Directly proxy to named location for S3
            # rewrite cannot be used inside if block, so we always rewrite
            # The conditional logic is handled in the named location if needed
            # Note: rewrite with 'last' to jump to named location
            # rewrite .* @s3_establishment_profile last;
        }
        
        # Named location for S3 proxy - avoids if-block limitations
        # Called via rewrite with 'last' flag from main location block
        # All variables set in the calling location block are accessible here
        # This allows proxy_set_header Host to work reliably (not in an if-block context)
        location @s3_establishment_profile {
            internal;
            
            # Debug: return immediately to test if named location is being called
            return 200 "REACHED NAMED LOCATION: city=$consumer_ui_city type=$consumer_ui_profile_type slug=$consumer_ui_slug";
            add_header Content-Type text/plain;
            
            # Include standard proxy params first
            include proxy_params;
            
            # Override Host header for S3 virtual-hosted bucket routing
            # Must be set to bucket name for virtual-hosted bucket requests
            # This must come AFTER include proxy_params to override the default Host
            proxy_set_header Host $consumer_ui_s3_bucket;
            
            #http://127:4566/localstack-bucket/consumer-ui/export-assets/bangalore/clinic/amritha-clinic-bannerghatta-road.html

            # Rewrite to S3 path with .html extension
            # Using 'break' flag to stop rewrite processing and continue with proxy_pass
            #rewrite ^ /$consumer_ui_s3_folder_name/$consumer_ui_city/$consumer_ui_profile_type/$consumer_ui_slug.html break;
            # Error handling for S3 404s
            proxy_intercept_errors on;
            error_page 404 = @establishment_profile_fallback;
            
            # Proxy to S3 endpoint
            rewrite ^ /$consumer_ui_s3_bucket/$consumer_ui_s3_folder_name/$consumer_ui_city/$consumer_ui_profile_type/$consumer_ui_slug.html break;
            proxy_pass http://$consumer_ui_s3_endpoint/;
            
            
        }
        
        # Fallback location for establishment profile 404s from S3
        # Only called from consumer_ui flow when S3 returns 404 (file not found)
        # The named location @__s3_establishment_profile sets error_page 404 to this fallback
        # Topaz flow never calls this - it directly proxies and returns 404s to client
        location @establishment_profile_fallback {
            # Add headers to track S3-served content
            add_header SERVED-FROM "3Static" always;
            add_header S3-URL "3static" always;

            internal;
            
            # Always proxy to Next.js SSR when S3 returns 404
            # This handles cases where static files haven't been generated yet or generation failed
            set $consumer_ui_served_from "NEXT(SSR)";
            
            # Add standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Add custom headers to indicate source is Next.js SSR
            # add_header SERVED-FROM $consumer_ui_served_from always;
            # add_header S3-URL $consumer_ui_s3_url always;
            # Proxy to Next.js
            proxy_pass $upstream_consumer_ui;
        }
        
        # Default location
        location / {
            return 200 "OK";
        }
    }
    
    # Fallback server
    server {
        listen 80 default_server;
        server_name _;
        return 404 "Not found";
    }
}

