worker_processes 1;

events {
    worker_connections 1024;
}

http {
    error_log /tmp/nginx_test.log;
    access_log /tmp/nginx_test_access.log;
    
    # DNS resolver for proxy_pass with variables
    # Required for nginx to resolve domain names in proxy_pass when using variables
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Minimal proxy params
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    send_timeout                60s;
    
    # Variable for fabric detection
    map $args $fabric_is_sapphire {
        default 1;
        # ~sapphire=0 0;
    }
    
    # Combined conditions: fabric_is_sapphire AND query params
    map "$fabric_is_sapphire:$arg_cache_refresh" $consumer_ui_forced_cache_refresh {
        default 0;
        "1:true" 1;
    }
    
    map "$fabric_is_sapphire:$arg_hard_cache_refresh" $consumer_ui_forced_hard_cache_refresh {
        default 0;
        "1:true" 1;

    }
    
    server {
        listen 8082;
        server_name test.local;
        
        set $upstream_consumer_ui http://127.0.0.1:3000;
        set $upstream_topaz http://127.0.0.1:3000;
        set $upstream_sapphire_app http://127.0.0.1:8080;

        # S3 proxy for static HTML files (SSG)
        # Falls back to Next.js SSR on any S3 error (403, 404, 401, 5xx)
        location = /consumer_ui_establishment_profile_s3 {
            internal;
            
            add_header SERVED-FROM $consumer_ui_served_from always;
            add_header S3-URL $consumer_ui_s3_url always;

            proxy_set_header Host $consumer_ui_s3_endpoint;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 403 404 401 500 502 503 504 = @consumer_ui_establishemnt_profile_ssr_fallback;

            rewrite ^ /$consumer_ui_s3_folder_name/$consumer_ui_s3_path break;
            
            # proxy_ssl_server_name on;
            # proxy_ssl_verify off;
            proxy_pass https://$consumer_ui_s3_endpoint;
        }
        
        # Fallback to Next.js SSR when S3 fails (missing files, access denied, or S3 errors)
        location @consumer_ui_establishemnt_profile_ssr_fallback {
            internal;

            set $consumer_ui_served_from "NEXT(SSR)";
            add_header SERVED-FROM $consumer_ui_served_from always;
            add_header S3-URL $consumer_ui_s3_url always;
            
            include proxy_params;
            proxy_pass $upstream_consumer_ui$request_uri;
        }

        # Force Next.js SSR when cache_refresh or hard_cache_refresh is true
        location = /consumer_ui_establishemnt_profile_forced_ssr {
            internal;
            
            set $consumer_ui_served_from "NEXT(SSR)";
            add_header SERVED-FROM $consumer_ui_served_from always;
            add_header S3-URL $consumer_ui_s3_url always;

            include proxy_params;
            proxy_pass $upstream_consumer_ui$request_uri;
        }
        
        # Clinic/Hospital Profile Pages
        # Consumer UI: S3 (SSG) → Next.js SSR fallback on S3 errors (403, 404, 401, 5xx)
        location ~* ^/([^/]+)/(clinic|hospital)/([^/]+)(/[^/]+)?$ {
            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }

            set $consumer_ui_city $1;
            set $consumer_ui_profile_type $2;
            set $consumer_ui_slug $3;
            set $consumer_ui_sub_page $4;
            
            set $consumer_ui_s3_bucket "practo-dev-mumbai-static-apps";
            set $consumer_ui_s3_endpoint "practo-dev-mumbai-static-apps.s3.ap-south-1.amazonaws.com";
            set $consumer_ui_s3_folder_name "consumer-ui/export-assets";
            
            set $consumer_ui_s3_path "$consumer_ui_city/$consumer_ui_profile_type/$consumer_ui_slug$consumer_ui_sub_page.html";
            set $consumer_ui_s3_url "https://$consumer_ui_s3_endpoint/$consumer_ui_s3_folder_name/$consumer_ui_s3_path";
            set $consumer_ui_served_from "AWS(SSG)";
            
            if ($consumer_ui_forced_cache_refresh = 1) {
                rewrite ^ /consumer_ui_establishemnt_profile_forced_ssr last;
            }

            if ($consumer_ui_forced_hard_cache_refresh = 1) {
                rewrite ^ /consumer_ui_establishemnt_profile_forced_ssr last;
            }            
            
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /consumer_ui_establishment_profile_s3 last;
            }
        }

        # S3 assets for consumer-ui (images, CSS, JS from exported profile pages)
        location ~ ^/consumer-ui-assets/(?P<path>.*) {
            set $consumer_ui_s3_endpoint "practo-dev-mumbai-static-apps.s3.ap-south-1.amazonaws.com";
            
            proxy_set_header Host $consumer_ui_s3_endpoint;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # proxy_ssl_server_name on;
            # proxy_ssl_verify off;
            proxy_pass https://$consumer_ui_s3_endpoint/consumer-ui/export-assets/$path;
        }
        
        # Catch-all location block - proxy everything else to sapphire app
        location / {
            # Override Host header to send upstream host instead of nginx host
            proxy_set_header Host localhost:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;  # Preserve original host for reference
            proxy_pass $upstream_sapphire_app$request_uri;
        }
    }
    
    # Fallback server
    server {
        listen 80 default_server;
        server_name _;
        return 404 "Not found";
    }
}

