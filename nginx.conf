worker_processes 1;

events {
    worker_connections 1024;
}

http {
    error_log /tmp/nginx_test.log;
    access_log /tmp/nginx_test_access.log;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    send_timeout          60s;

    # --- Device detection (mirrors staging) ---
    map $args $fabric_is_sapphire {
        default 1;
        ~sapphire=0 0;
    }

    # --- Listing rollout maps ---

    # Initialize $stored_city — set to actual value inside location blocks
    # via (?P<city_capture>...) + set $stored_city $city_capture
    map $uri $stored_city {
        default "";
    }

    # City-based gradual rollout for listing routes (not CityLandingPage)
    # $stored_city is set per location block via (?P<city_capture>...) regex
    map $stored_city $is_consumer_ui_listing_city_override {
        "~*^hyderabad$"  1;
        default          0;
    }

    # City tier map — tier-1 cities for /:city route only
    # These return page_type="listing" from oneword API → full doctor listing
    # Tier-2 cities return page_type="city" → simpler tabbed page
    # NOTE: exact list needs confirmation from backend/product
    map $stored_city $is_tier1_city {
        "~*^(bangalore|delhi|mumbai|pune|hyderabad|chennai|kolkata|gurgaon|noida|ahmedabad|jaipur|chandigarh|lucknow|indore|nagpur|coimbatore|goa|bhopal|visakhapatnam|kochi|thiruvananthapuram|mysore)$"  1;
        default  0;
    }

    server {
        listen 8082;
        server_name localhost;

        # --- Upstreams ---
        set $upstream_sapphire    http://127.0.0.1:8080;
        set $upstream_consumer_ui http://127.0.0.1:3000;
        set $upstream_topaz       http://127.0.0.1:3001;

        # =================================================================
        # EXISTING BLOCKS (from sfctrl — simplified, no locale/country/fabric)
        # Order mirrors staging. These are ABOVE where listing blocks will go.
        # =================================================================

        # --- Establishment feedback (topaz only) ---
        # /:city/(clinic|hospital)/:slug/feedback
        location ~* ^/[^/]+/(clinic|hospital)/[^/]+/feedback$ {
            include proxy_params;
            proxy_pass $upstream_topaz;
        }

        # --- Establishment sub-pages (doctors, recent, insurances, etc.) ---
        # /:city/(clinic|hospital)/:slug/(doctors|recent|insurances|...)
        location ~* ^/[^/]+/(clinic|hospital)/[^/]+/(doctors|recent|insurances|recommended|services|reviews|amp|faq|other-centers)$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_sapphire;
            }

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
        }

        # --- Establishment/Doctor procedures pages ---
        # /:city/(clinic|hospital|doctor)/:slug/procedures(/:id(/photos(/:id)?)?)?
        location ~* ^/[^/]+/(clinic|hospital|doctor)/[^/]+/procedures(/[^/]+(/photos(/[^/]+)?)?)?/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_consumer_ui;
            }

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
        }

        # --- Establishment/Doctor photos pages ---
        # /:city/(clinic|hospital|doctor)/:slug/photos(/:id)?
        location ~* ^/[^/]+/(clinic|hospital|doctor)/[^/]+/photos(/[^/]+)?/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_consumer_ui;
            }

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
        }

        # --- Clinic/Hospital profile pages ---
        # /:city/(clinic|hospital)/:slug(/:sub_page)?
        location ~* ^/([^/]+)/(clinic|hospital)/([^/]+)(/[^/]+)?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_consumer_ui;
            }

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
        }

        # --- Doctor profile pages ---
        # /:city/(doctor|therapist|technician)/:slug(/stories)?
        location ~* ^/(?:[^/]+)/(doctor|therapist|technician)/[^/]+(/?|/stories/?)$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_consumer_ui;
            }

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
        }

        # --- Doctor profile photos ---
        # /:city/doctor/:slug/:id/photos(/:photo_slug)?
        location ~* ^/[^/]+/doctor/[^/]+/\d+/photos(/[^/]+)?/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_consumer_ui;
            }
        }

        # --- Doctor/Establishment feedback ---
        # /:city/(doctor|therapist|...|hospital|clinic|medical-center)/:slug/(feedback|external-feedback)
        location ~* ^/[^/]+/(doctor|therapist|technician|hospital|clinic|medical-center)/[^/]+/(feedback|external-feedback)/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_sapphire;
            }
        }

        # --- Search page (bare /search) ---
        location ~* ^/search/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_sapphire;
            }
        }

        # --- Covid hospital listing ---
        # /:city/covid-hospital-listing(/:sub)?
        location ~* ^/([^/]+/)covid-hospital-listing(/[^/]+)?$ {
            include proxy_params;
            proxy_pass $upstream_sapphire;
        }

        # --- Oneword / City landing ---
        # /:city (single segment catch-all)
        location ~* ^/([^/]+)/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_sapphire;
            }
        }

        # --- My doctors ---
        # /doctors/managemydoctors
        location ~* ^/doctors/managemydoctors/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_sapphire;
            }
        }

        # --- Clinic microsite doctor ---
        # /:clinic_slug/doctor/:id/:doctor_slug
        location ~* ^/([^/]+/)doctor/[\d]+/([^/]+)/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_sapphire;
            }
        }

        # --- Wellness/Establishment listing & profile ---
        # /:city/(wellness-centers|spa|gym|...)/:slug?/:locality?
        location ~* ^/[^/]+/(wellness-centers|spa|spa-therapist|beautician|saloon|gyms|spas-salons|fitness-centers|spas-salons-all|wellness-center|spa-salon|fitness-center|gym|medical-center)(/[^/]+)?(/[^/]+)?/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_sapphire;
            }
        }

        # --- Wellness (keyword before type) ---
        # /:city/:keyword/(wellness-centers|spa|gym|...)/:locality?
        location ~* ^/[^/]+/[^/]+/(wellness-centers|spa|spa-therapist|beautician|saloon|gyms|spas-salons|fitness-centers|spas-salons-all|wellness-center|spa-salon|fitness-center|gym|medical-center)(/[^/]+)?/?$ {
            include proxy_params;

            if ($fabric_is_sapphire = 1) {
                proxy_pass $upstream_sapphire;
            }
        }

        # =================================================================
        # LISTING BLOCKS
        # =================================================================

        # --- Shared internal proxy for listing mweb split ---
        # All listing location blocks rewrite here for mobile.
        # Full split logic: default sapphire, city/cookie/queryparam overrides.
        location = /listing_mweb_proxy {
            internal;
            include proxy_params;

            # Default: sapphire
            set $listing_mweb_url $upstream_sapphire;

            # City override → consumer-ui
            if ($is_consumer_ui_listing_city_override = 1) {
                set $listing_mweb_url $upstream_consumer_ui;
            }

            # Cookie override → consumer-ui
            if ($cookie_serve_listing_from_consumer_ui) {
                set $listing_mweb_url $upstream_consumer_ui;
            }

            # Query param override → consumer-ui
            if ($arg_serve_listing_from_consumer_ui = "true") {
                set $listing_mweb_url $upstream_consumer_ui;
            }

            # Query param force-back → sapphire (highest priority)
            if ($arg_serve_listing_from_consumer_ui = "false") {
                set $listing_mweb_url $upstream_sapphire;
            }

            proxy_pass $listing_mweb_url$request_uri;
        }

        # ClinicGroupDoctorsPage: /:city/clinic/:slug/group/doctors
        location ~* ^/(?P<city_capture>[^/]+)/clinic/[^/]+/group/doctors/?$ {
            include proxy_params;
            add_header X-Listing-Route "ClinicGroupDoctorsPage" always;
            set $stored_city $city_capture;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /listing_mweb_proxy last;
            }
        }

        # HospitalGroupDoctorsPage: /:city/hospital/:slug/group/doctors
        location ~* ^/(?P<city_capture>[^/]+)/hospital/[^/]+/group/doctors/?$ {
            include proxy_params;
            add_header X-Listing-Route "HospitalGroupDoctorsPage" always;
            set $stored_city $city_capture;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /listing_mweb_proxy last;
            }
        }

        # LocalityProcedureCostPage: /:city/:keyword/:locality/cost/procedure
        location ~* ^/(?P<city_capture>[^/]+)/[^/]+/[^/]+/cost/procedure/?$ {
            include proxy_params;
            add_header X-Listing-Route "LocalityProcedureCostPage" always;
            set $stored_city $city_capture;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /listing_mweb_proxy last;
            }
        }

        # LocalityProcedureListingPage: /:city/:keyword/:locality/procedure
        location ~* ^/(?P<city_capture>[^/]+)/[^/]+/[^/]+/procedure/?$ {
            include proxy_params;
            add_header X-Listing-Route "LocalityProcedureListingPage" always;
            set $stored_city $city_capture;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /listing_mweb_proxy last;
            }
        }

        # ProcedureCostPage: /:city/:keyword/cost/procedure
        location ~* ^/(?P<city_capture>[^/]+)/[^/]+/cost/procedure/?$ {
            include proxy_params;
            add_header X-Listing-Route "ProcedureCostPage" always;
            set $stored_city $city_capture;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /listing_mweb_proxy last;
            }
        }

        # ProcedureListingPage: /:city/:keyword/procedure
        location ~* ^/(?P<city_capture>[^/]+)/[^/]+/procedure/?$ {
            include proxy_params;
            add_header X-Listing-Route "ProcedureListingPage" always;
            set $stored_city $city_capture;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /listing_mweb_proxy last;
            }
        }

        # CerebroDoctorsPage: /search/doctors
        location ~* ^/search/doctors/?$ {
            include proxy_params;
            add_header X-Listing-Route "CerebroDoctorsPage" always;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /listing_mweb_proxy last;
            }
        }

        # CerebroProcedurePage: /search/procedure
        location ~* ^/search/procedure/?$ {
            include proxy_params;
            add_header X-Listing-Route "CerebroProcedurePage" always;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /listing_mweb_proxy last;
            }
        }

        # CityAllDoctorsPage: /:city/doctors
        location ~* ^/(?P<city_capture>[^/]+)/doctors/?$ {
            include proxy_params;
            add_header X-Listing-Route "CityAllDoctorsPage" always;
            set $stored_city $city_capture;

            if ($fabric_is_sapphire = 0) {
                proxy_pass $upstream_topaz;
            }
            if ($fabric_is_sapphire = 1) {
                rewrite ^ /listing_mweb_proxy last;
            }
        }

        # # --- Catch-all (mirrors staging) ---
        # location / {
        #     include proxy_params;

        #     if ($fabric_is_sapphire = 0) {
        #         proxy_pass $upstream_topaz;
        #     }

        #     if ($fabric_is_sapphire = 1) {
        #         proxy_pass $upstream_sapphire;
        #     }
        # }
    }

    # Fallback server
    server {
        listen 80 default_server;
        server_name _;
        return 404 "Not found";
    }
}
